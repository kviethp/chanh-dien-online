name: Chanh Dien LIVE V3 QA
on:
  pull_request:
    paths:
      - 'live/**'
      - 'assets/**'
      - '.github/workflows/live-qa.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Collect dependency audit evidence
        if: always()
        run: mkdir -p qa-artifacts && npm audit --json > qa-artifacts/npm-audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-v3-dependency-audit
          path: live/qa-artifacts/npm-audit.json
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: live/package-lock.json
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
        env:
          CI: 'true'
      - run: node browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-v3-browser-screenshots
          path: live/qa-artifacts/
          retention-days: 14
